<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블로그 프로필 페이지</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #FAFAFA;
            color: #18181B;
        }
    </style>
</head>
<body class="min-h-screen antialiased">

    <!-- =================================================================
         1. 상단 헤더 영역 (사이드바 토글 버튼, 블로그 타이틀 & 새 글 쓰기 버튼)
         ================================================================= -->
    <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-zinc-200">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <!-- 사이드바 열기/닫기 토글 버튼 -->
                <button type="button" id="sidebar-toggle-btn" aria-label="사이드바 토글" class="p-2 -ml-2 rounded-xl text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <a href="#" class="text-sm font-bold tracking-tight text-zinc-900">
                    MY BLOG
                </a>
            </div>
            <button type="button" id="toggle-editor-btn" class="px-3.5 py-1.5 rounded-xl bg-zinc-900 text-white text-xs font-medium hover:bg-zinc-700 transition">
                + 새 글 쓰기
            </button>
        </div>
    </header>

    <!-- 모바일 사이드바 배경 오버레이 -->
    <div id="sidebar-backdrop" class="fixed inset-0 z-30 bg-zinc-900/40 backdrop-blur-[1px] hidden lg:hidden transition-opacity"></div>

    <!-- =================================================================
         2. 메인 2단 레이아웃 (접이식 좌측 사이드바 + 우측 글 본문)
         ================================================================= -->
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex items-start gap-0 lg:gap-8">

        <!-- [좌측 사이드바] 모바일 슬라이드 드로어 + 데스크톱 접이식 패널 -->
        <aside id="left-sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-white border-r border-zinc-200 transform -translate-x-full transition-all duration-300 ease-in-out lg:static lg:translate-x-0 lg:w-72 lg:shrink-0 lg:rounded-2xl lg:border lg:overflow-hidden flex flex-col justify-between">
            <div class="overflow-y-auto flex-1">
                <!-- 모바일 전용 사이드바 상단 닫기 바 -->
                <div class="flex items-center justify-between px-4 py-3 border-b border-zinc-100 lg:hidden">
                    <span class="text-xs font-bold text-zinc-900">메뉴 및 글 목록</span>
                    <button type="button" id="sidebar-close-btn" class="p-1.5 rounded-lg text-zinc-400 hover:text-zinc-700 hover:bg-zinc-100">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <!-- 1. 상단 프로필 영역 -->
                <div class="p-5 flex items-center gap-3.5 border-b border-zinc-100">
                    <div class="w-12 h-12 rounded-2xl bg-zinc-100 border border-dashed border-zinc-300 flex items-center justify-center text-[10px] text-zinc-400 shrink-0">
                        프로필
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-sm font-bold text-zinc-900 truncate">이름 / 닉네임</h1>
                        <p class="text-xs text-zinc-500 mt-0.5 truncate">간단한 한 줄 소개</p>
                    </div>
                </div>

                <!-- 2. 글 검색창 -->
                <div class="px-3.5 pt-3.5 pb-1">
                    <div class="relative">
                        <svg class="w-3.5 h-3.5 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z"></path>
                        </svg>
                        <input type="text" id="post-search-input" placeholder="글 검색..."
                               class="w-full pl-8 pr-7 py-2 text-xs rounded-xl bg-zinc-50 border border-zinc-200 text-zinc-800 placeholder:text-zinc-400 focus:outline-none focus:bg-white focus:border-zinc-400 transition">
                        <button type="button" id="search-clear-btn" aria-label="검색어 지우기"
                                class="hidden absolute right-2 top-1/2 -translate-y-1/2 p-0.5 rounded-full text-zinc-400 hover:text-zinc-700">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 3. 글 목록 영역 -->
                <div class="p-3">
                    <div class="px-2.5 py-1.5 flex items-center justify-between text-[11px] font-semibold text-zinc-400">
                        <span>글 목록</span>
                        <span id="post-count" class="text-zinc-500">2</span>
                    </div>
                    <ul id="sidebar-post-list" class="mt-1 space-y-1 max-h-[380px] overflow-y-auto">
                        <!-- 자바스크립트로 글 목록 렌더링 -->
                    </ul>
                </div>
            </div>
        </aside>

        <!-- [우측 메인 영역] 새 글 작성 폼 + 선택된 게시글 본문 -->
        <main class="flex-1 min-w-0 space-y-6">

            <!-- =========================================================
                 A. 새 글 작성 영역 (기본 접힘, 상단 버튼 클릭 시 열림)
                 ========================================================= -->
            <section id="editor-box" class="hidden p-5 sm:p-6 rounded-2xl bg-white border border-zinc-300 shadow-sm space-y-4">
                <div class="flex items-center justify-between pb-3 border-b border-zinc-100">
                    <h2 class="text-sm font-bold text-zinc-900">새 글 작성</h2>
                    <button type="button" id="close-editor-btn" class="text-xs text-zinc-400 hover:text-zinc-700">닫기</button>
                </div>

                <form id="post-form" class="space-y-3.5">
                    <div class="flex flex-col sm:flex-row gap-3">
                        <select id="post-category" class="px-3 py-2 text-xs rounded-xl border border-zinc-200 bg-zinc-50 text-zinc-700 focus:outline-none focus:border-zinc-400">
                            <option value="일상">일상</option>
                            <option value="기록">기록</option>
                            <option value="개발/작업">개발/작업</option>
                        </select>
                        <input type="text" id="post-title" placeholder="글 제목을 입력하세요" required
                               class="flex-1 px-3.5 py-2 text-xs rounded-xl border border-zinc-200 focus:outline-none focus:border-zinc-400">
                    </div>

                    <textarea id="post-content" rows="6" placeholder="내용을 입력하세요..." required
                              class="w-full p-3.5 text-xs leading-relaxed rounded-xl border border-zinc-200 focus:outline-none focus:border-zinc-400 resize-y"></textarea>

                    <!-- 이미지 첨부 및 미리보기 영역 -->
                    <div class="space-y-2.5">
                        <div class="flex items-center gap-2">
                            <label for="post-image" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-xl border border-zinc-200 bg-zinc-50 text-zinc-700 hover:bg-zinc-100 cursor-pointer transition">
                                <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                </svg>
                                <span>이미지 첨부</span>
                            </label>
                            <input type="file" id="post-image" accept="image/*" class="hidden">
                            <span id="post-image-name" class="text-[11px] text-zinc-400 truncate max-w-[200px]">선택된 파일 없음</span>
                        </div>

                        <div id="image-preview-wrap" class="hidden relative inline-block">
                            <img id="image-preview" src="" alt="첨부 이미지 미리보기" class="max-h-48 rounded-xl border border-zinc-200 object-cover">
                            <button type="button" id="remove-image-btn" aria-label="이미지 제거"
                                    class="absolute top-2 right-2 w-6 h-6 rounded-full bg-zinc-900/75 text-white text-xs flex items-center justify-center hover:bg-zinc-900 transition">
                                ×
                            </button>
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 pt-1">
                        <button type="button" id="cancel-editor-btn" class="px-4 py-2 text-xs font-medium rounded-xl border border-zinc-200 text-zinc-600 hover:bg-zinc-50">
                            취소
                        </button>
                        <button type="submit" class="px-4 py-2 text-xs font-medium rounded-xl bg-zinc-900 text-white hover:bg-zinc-700">
                            글 올리기
                        </button>
                    </div>
                </form>
            </section>

            <!-- =========================================================
                 B. 우측 게시글 본문 뷰어 (좌측 목록에서 선택한 글 표시)
                 ========================================================= -->
            <article id="post-viewer" class="p-6 sm:p-9 rounded-2xl bg-white border border-zinc-200 min-h-[420px]">
                <div class="flex items-center justify-between pb-4 mb-6 border-b border-zinc-100 text-xs text-zinc-400">
                    <span id="view-category" class="px-2.5 py-0.5 rounded-md bg-zinc-100 text-zinc-700 font-medium">일상</span>
                    <span id="view-date">2026.11.25</span>
                </div>

                <h2 id="view-title" class="text-xl sm:text-2xl font-bold text-zinc-900 mb-6">
                    첫 번째 샘플 글 제목
                </h2>

                <!-- 본문 첨부 이미지 표시 영역 -->
                <div id="view-image-wrap" class="hidden mb-6">
                    <img id="view-image" src="" alt="게시글 첨부 이미지" class="w-full max-h-[440px] object-contain rounded-xl border border-zinc-100 bg-zinc-50">
                </div>

                <div id="view-content" class="text-sm sm:text-base text-zinc-700 leading-relaxed whitespace-pre-line">
                    왼쪽 목록에서 글을 선택하면 이 영역에 해당 글의 본문이 표시됩니다.
                    상단의 [+ 새 글 쓰기] 버튼을 눌러 새로운 글을 작성하고 목록에 추가할 수 있습니다.
                </div>
            </article>

        </main>
    </div>

    <!-- 글 데이터 관리, 좌측 목록 렌더링 및 우측 본문 표시 스크립트 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 초기 샘플 게시글 데이터
            const posts = [
                {
                    id: 1,
                    category: '일상',
                    date: '2026.11.25',
                    title: '첫 번째 샘플 글 제목',
                    content: '왼쪽 목록에서 글을 선택하면 이 영역에 해당 글의 본문이 표시됩니다.\n상단의 [+ 새 글 쓰기] 버튼을 눌러 새로운 글을 작성하고 목록에 추가할 수 있습니다.'
                },
                {
                    id: 2,
                    category: '기록',
                    date: '2026.11.20',
                    title: '두 번째 샘플 글 제목',
                    content: '두 번째 샘플 글의 본문 영역입니다.\n카테고리 버튼을 누르면 왼쪽 글 목록이 해당 카테고리로 필터링됩니다.'
                }
            ];

            let currentCategory = 'all';
            let searchQuery = '';
            let activePostId = posts[0].id;
            let isDesktopSidebarCollapsed = false;
            let uploadedImageUrl = null;

            const leftSidebar = document.getElementById('left-sidebar');
            const sidebarBackdrop = document.getElementById('sidebar-backdrop');
            const sidebarToggleBtn = document.getElementById('sidebar-toggle-btn');
            const sidebarCloseBtn = document.getElementById('sidebar-close-btn');
            const sidebarPostList = document.getElementById('sidebar-post-list');
            const postCountEl = document.getElementById('post-count');
            const postSearchInput = document.getElementById('post-search-input');
            const searchClearBtn = document.getElementById('search-clear-btn');

            const editorBox = document.getElementById('editor-box');
            const toggleEditorBtn = document.getElementById('toggle-editor-btn');
            const closeEditorBtn = document.getElementById('close-editor-btn');
            const cancelEditorBtn = document.getElementById('cancel-editor-btn');
            const postForm = document.getElementById('post-form');
            const postImageInput = document.getElementById('post-image');
            const postImageName = document.getElementById('post-image-name');
            const imagePreviewWrap = document.getElementById('image-preview-wrap');
            const imagePreview = document.getElementById('image-preview');
            const removeImageBtn = document.getElementById('remove-image-btn');

            const viewCategory = document.getElementById('view-category');
            const viewDate = document.getElementById('view-date');
            const viewTitle = document.getElementById('view-title');
            const viewImageWrap = document.getElementById('view-image-wrap');
            const viewImage = document.getElementById('view-image');
            const viewContent = document.getElementById('view-content');

            // 첨부 이미지 초기화 헬퍼
            function resetImageAttachment() {
                uploadedImageUrl = null;
                if (postImageInput) postImageInput.value = '';
                if (postImageName) postImageName.textContent = '선택된 파일 없음';
                if (imagePreview) imagePreview.src = '';
                if (imagePreviewWrap) imagePreviewWrap.classList.add('hidden');
            }

            // 우측 게시글 본문 렌더링
            function renderViewer(post) {
                if (!post) return;
                activePostId = post.id;
                if (viewCategory) viewCategory.textContent = post.category;
                if (viewDate) viewDate.textContent = post.date;
                if (viewTitle) viewTitle.textContent = post.title;
                if (viewImageWrap && viewImage) {
                    if (post.imageUrl) {
                        viewImage.src = post.imageUrl;
                        viewImageWrap.classList.remove('hidden');
                    } else {
                        viewImage.src = '';
                        viewImageWrap.classList.add('hidden');
                    }
                }
                if (viewContent) viewContent.textContent = post.content;
            }

            // 왼쪽 사이드바 글 목록 렌더링 (검색어 필터링 반영)
            function renderSidebarList() {
                const keyword = searchQuery.trim().toLowerCase();
                const filteredPosts = keyword
                    ? posts.filter(post =>
                        post.title.toLowerCase().includes(keyword) ||
                        post.content.toLowerCase().includes(keyword) ||
                        post.category.toLowerCase().includes(keyword)
                      )
                    : posts;

                if (postCountEl) postCountEl.textContent = filteredPosts.length;
                sidebarPostList.innerHTML = '';

                if (filteredPosts.length === 0) {
                    const emptyMsg = keyword ? `'${searchQuery}' 검색 결과가 없습니다.` : '작성된 글이 없습니다.';
                    sidebarPostList.innerHTML = `<li class="px-3 py-6 text-center text-xs text-zinc-400">${emptyMsg}</li>`;
                    return;
                }

                filteredPosts.forEach(post => {
                    const isActive = post.id === activePostId;
                    const li = document.createElement('li');
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = isActive
                        ? 'w-full text-left px-3 py-2.5 rounded-xl bg-zinc-900 text-white transition'
                        : 'w-full text-left px-3 py-2.5 rounded-xl hover:bg-zinc-100 text-zinc-700 transition';

                    btn.innerHTML = `
                        <div class="flex items-center justify-between gap-1.5">
                            <span class="text-xs font-semibold truncate">${post.title}</span>
                            ${post.imageUrl ? '<span class="text-[10px] shrink-0 opacity-75" title="이미지 포함">🖼️</span>' : ''}
                        </div>
                        <div class="flex items-center justify-between mt-1 text-[10px] ${isActive ? 'text-zinc-300' : 'text-zinc-400'}">
                            <span>${post.category}</span>
                            <span>${post.date}</span>
                        </div>
                    `;

                    btn.addEventListener('click', () => {
                        if (editorBox) editorBox.classList.add('hidden');
                        renderViewer(post);
                        renderSidebarList();
                        closeMobileSidebar();
                    });

                    li.appendChild(btn);
                    sidebarPostList.appendChild(li);
                });
            }

            // 검색 입력 및 초기화 이벤트
            if (postSearchInput) {
                postSearchInput.addEventListener('input', (e) => {
                    searchQuery = e.target.value;
                    if (searchClearBtn) {
                        searchClearBtn.classList.toggle('hidden', searchQuery.length === 0);
                    }
                    renderSidebarList();
                });
            }

            if (searchClearBtn && postSearchInput) {
                searchClearBtn.addEventListener('click', () => {
                    searchQuery = '';
                    postSearchInput.value = '';
                    searchClearBtn.classList.add('hidden');
                    renderSidebarList();
                    postSearchInput.focus();
                });
            }

            // 모바일 사이드바 닫기 헬퍼
            function closeMobileSidebar() {
                if (window.innerWidth < 1024 && leftSidebar && sidebarBackdrop) {
                    leftSidebar.classList.add('-translate-x-full');
                    sidebarBackdrop.classList.add('hidden');
                }
            }

            // 사이드바 열기/닫기 토글 (모바일: 드로어 / 데스크톱: 접기·펼치기)
            if (sidebarToggleBtn && leftSidebar) {
                sidebarToggleBtn.addEventListener('click', () => {
                    if (window.innerWidth < 1024) {
                        const isClosed = leftSidebar.classList.contains('-translate-x-full');
                        if (isClosed) {
                            leftSidebar.classList.remove('-translate-x-full');
                            if (sidebarBackdrop) sidebarBackdrop.classList.remove('hidden');
                        } else {
                            closeMobileSidebar();
                        }
                    } else {
                        isDesktopSidebarCollapsed = !isDesktopSidebarCollapsed;
                        if (isDesktopSidebarCollapsed) {
                            leftSidebar.classList.add('lg:hidden');
                        } else {
                            leftSidebar.classList.remove('lg:hidden');
                        }
                    }
                });
            }

            if (sidebarCloseBtn) sidebarCloseBtn.addEventListener('click', closeMobileSidebar);
            if (sidebarBackdrop) sidebarBackdrop.addEventListener('click', closeMobileSidebar);

            // 글쓰기 창 열기/닫기 이벤트 안전 바인딩
            if (toggleEditorBtn && editorBox) {
                toggleEditorBtn.addEventListener('click', () => editorBox.classList.toggle('hidden'));
            }
            if (closeEditorBtn && editorBox) {
                closeEditorBtn.addEventListener('click', () => editorBox.classList.add('hidden'));
            }
            if (cancelEditorBtn && editorBox && postForm) {
                cancelEditorBtn.addEventListener('click', () => {
                    postForm.reset();
                    resetImageAttachment();
                    editorBox.classList.add('hidden');
                });
            }

            // 이미지 파일 선택 시 미리보기 생성
            if (postImageInput) {
                postImageInput.addEventListener('change', (e) => {
                    const file = e.target.files && e.target.files[0];
                    if (!file) {
                        resetImageAttachment();
                        return;
                    }
                    if (uploadedImageUrl) URL.revokeObjectURL(uploadedImageUrl);
                    uploadedImageUrl = URL.createObjectURL(file);
                    if (postImageName) postImageName.textContent = file.name;
                    if (imagePreview) imagePreview.src = uploadedImageUrl;
                    if (imagePreviewWrap) imagePreviewWrap.classList.remove('hidden');
                });
            }

            if (removeImageBtn) {
                removeImageBtn.addEventListener('click', resetImageAttachment);
            }

            // 새 글 등록 처리
            if (postForm) {
                postForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const category = document.getElementById('post-category').value;
                    const title = document.getElementById('post-title').value.trim();
                    const content = document.getElementById('post-content').value.trim();
                    if (!title || !content) return;

                    const today = new Date();
                    const dateStr = `${today.getFullYear()}.${String(today.getMonth() + 1).padStart(2, '0')}.${String(today.getDate()).padStart(2, '0')}`;

                    const newPost = {
                        id: Date.now(),
                        category,
                        date: dateStr,
                        title,
                        content,
                        imageUrl: uploadedImageUrl
                    };

                    posts.unshift(newPost);
                    renderViewer(newPost);
                    renderSidebarList();

                    postForm.reset();
                    uploadedImageUrl = null;
                    if (postImageName) postImageName.textContent = '선택된 파일 없음';
                    if (imagePreview) imagePreview.src = '';
                    if (imagePreviewWrap) imagePreviewWrap.classList.add('hidden');
                    editorBox.classList.add('hidden');
                });
            }

            // 초기 렌더링
            renderViewer(posts[0]);
            renderSidebarList();
        });
    </script>
</body>
</html>
