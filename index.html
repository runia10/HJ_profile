<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강아지나라 - 품종 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F1E4;
    --surface:#FFFFFF;
    --ink:#2B3A2F;
    --ink-muted:#767F6F;
    --border:#E3D9C4;
    --accent:#B8862B;
    --accent-soft:#F0E4C8;
    --small:#7FA98C;
    --small-soft:#E7F0E9;
    --medium:#C98A3E;
    --medium-soft:#F5E7D3;
    --large:#6B7FA3;
    --large-soft:#E6EAF2;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .mono{ font-family:'IBM Plex Mono', monospace; }

  .page{
    max-width:1080px;
    margin:0 auto;
    padding:52px 24px 60px;
  }

  .eyebrow{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:10px;
  }

  /* ---- Masthead ---- */
  .masthead{
    border-bottom:2px solid var(--ink);
    padding-bottom:24px;
    margin-bottom:28px;
  }

  .masthead h1{
    margin:0;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(34px, 5vw, 46px);
    line-height:1.05;
  }

  .tagline{
    margin:8px 0 0;
    color:var(--ink-muted);
    font-size:15px;
    font-style:italic;
    font-family:'Fraunces', serif;
  }

  /* ---- Controls layout ---- */
  .controls{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:28px;
    margin-bottom:34px;
  }

  @media (max-width: 760px){
    .controls{ grid-template-columns:1fr; }
  }

  #searchInput{
    width:100%;
    padding:13px 16px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface);
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    color:var(--ink);
    margin-bottom:18px;
  }

  #searchInput:focus{
    outline:none;
    border-color:var(--accent);
  }

  .filterLabel{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin-bottom:10px;
    display:block;
  }

  /* ---- Size taxonomy tree ---- */
  .sizePanel{
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    background:var(--surface);
  }

  .treeNode{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    color:var(--ink-muted);
    width:fit-content;
  }

  .treeNode.active{
    background:var(--ink);
    color:var(--bg);
  }

  .treeNode:hover:not(.active){
    background:var(--accent-soft);
    color:var(--ink);
  }

  .treeNode.root{ margin-bottom:6px; font-weight:500; }

  .treeGroup{ margin-bottom:2px; }

  .expandBtn{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ink-muted);
    font-size:10px;
    padding:0;
    width:12px;
    display:inline-block;
    transition:transform 0.15s ease;
  }

  .expandBtn.open{ transform:rotate(90deg); }

  .treeChildren{
    margin-left:20px;
    padding-left:12px;
    border-left:1px dashed var(--border);
    margin-top:3px;
    margin-bottom:6px;
    display:flex;
    flex-direction:column;
    gap:3px;
  }

  .treeChildren[hidden]{ display:none; }

  /* ---- Coat & personality chips ---- */
  .filterGroup{
    display:flex;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
  }

  .filterGroup:last-child{ margin-bottom:0; }

  .chip{
    padding:6px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-muted);
    font-size:13px;
    font-family:'Work Sans', sans-serif;
    cursor:pointer;
    transition:all 0.15s ease;
  }

  .chip:hover{ border-color:var(--accent); }

  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--bg);
  }

  /* ---- Grid ---- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:18px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(43,58,47,0.08);
    border-color:var(--accent);
  }

  .cardTop{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }

  .plateNo{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-muted);
  }

  .sizeTag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    padding:3px 8px;
    border-radius:999px;
    font-weight:500;
  }

  .iconWrap{
    width:64px; height:64px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    align-self:center;
  }

  .iconWrap svg{ width:34px; height:34px; }

  .cardName{
    text-align:center;
  }

  .cardName h3{
    margin:0 0 2px;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
  }

  .cardName span{
    font-size:12px;
    color:var(--ink-muted);
  }

  .cardTrait{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-muted);
    padding-top:10px;
    border-top:1px solid var(--border);
  }

  .emptyState{
    text-align:center;
    color:var(--ink-muted);
    padding:60px 0;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:16px;
  }

  .resultCount{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-muted);
    margin-bottom:14px;
  }

  /* ---- Modal ---- */
  .modalOverlay{
    position:fixed;
    inset:0;
    background:rgba(43,58,47,0.45);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 20px;
    overflow-y:auto;
    z-index:50;
  }

  .modalOverlay.open{ display:flex; }

  .modal{
    background:var(--surface);
    border-radius:14px;
    max-width:560px;
    width:100%;
    padding:32px;
    position:relative;
  }

  .modalClose{
    position:absolute;
    top:20px; right:20px;
    background:none;
    border:none;
    font-size:20px;
    color:var(--ink-muted);
    cursor:pointer;
    line-height:1;
    padding:4px;
  }

  .modalClose:hover{ color:var(--ink); }

  .modalHead{
    display:flex;
    gap:18px;
    align-items:center;
    border-bottom:1px solid var(--border);
    padding-bottom:20px;
    margin-bottom:20px;
  }

  .modalHead .iconWrap{ width:72px; height:72px; flex-shrink:0; }
  .modalHead .iconWrap svg{ width:38px; height:38px; }

  .modalHead h2{
    margin:0 0 4px;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
  }

  .modalHead .originLine{
    font-size:13px;
    color:var(--ink-muted);
  }

  .statRow{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 20px;
    margin-bottom:22px;
  }

  .statBlock .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin-bottom:4px;
  }

  .statBlock .value{
    font-size:14.5px;
    font-weight:500;
  }

  .gaugeSection{
    margin-bottom:22px;
  }

  .gaugeRow{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }

  .gaugeRow .label{
    width:88px;
    font-size:13px;
    color:var(--ink-muted);
    flex-shrink:0;
  }

  .dots{
    display:flex;
    gap:4px;
  }

  .dot{
    width:9px; height:9px;
    border-radius:50%;
    background:var(--border);
  }

  .dot.filled{ background:var(--accent); }

  .tagsSection{ margin-bottom:22px; }

  .sectionLabel{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin-bottom:10px;
  }

  .temperamentTags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }

  .temperamentTags span{
    background:var(--accent-soft);
    color:var(--accent);
    font-size:12.5px;
    padding:5px 12px;
    border-radius:999px;
    font-weight:500;
  }

  .noteBlock{
    margin-bottom:16px;
  }

  .noteBlock p{
    margin:0;
    font-size:13.5px;
    line-height:1.6;
    color:var(--ink);
  }

  .prosConsRow{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:22px;
  }

  .prosConsRow ul{
    margin:0;
    padding-left:18px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .prosConsRow li{
    font-size:13px;
    line-height:1.5;
  }

  .prosBlock .sectionLabel{ color:var(--small); }
  .consBlock .sectionLabel{ color:#B5654A; }

  .prosBlock li::marker{ color:var(--small); }
  .consBlock li::marker{ color:#B5654A; }

  @media (max-width: 480px){
    .prosConsRow{ grid-template-columns:1fr; }
  }

  .videoLink{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:11px 18px;
    background:var(--ink);
    color:var(--bg);
    border-radius:8px;
    text-decoration:none;
    font-size:13.5px;
    font-weight:500;
  }

  .videoLink:hover{ background:var(--accent); }

  .videoLink svg{ width:14px; height:14px; }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
  }

  @media (max-width: 480px){
    .statRow{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="page">
  <header class="masthead">
    <span class="eyebrow">DOG BREED FIELD GUIDE</span>
    <h1>강아지나라</h1>
    <p class="tagline">궁금한 강아지 품종을 찾아 살펴보세요</p>
  </header>

  <div class="controls">
    <div class="sizePanel">
      <span class="filterLabel">크기 분류</span>
      <div class="treeNode root active" data-level="all" data-value="">전체</div>

      <div class="treeGroup">
        <div class="treeNode" data-level="top" data-value="소형">
          <button class="expandBtn" data-group="소형" aria-label="소형 하위 분류 펼치기">▸</button>
          <span>소형</span>
        </div>
        <div class="treeChildren" data-group-children="소형" hidden>
          <div class="treeNode" data-level="sub" data-value="초소형">초소형</div>
          <div class="treeNode" data-level="sub" data-value="소형">소형</div>
        </div>
      </div>

      <div class="treeGroup">
        <div class="treeNode" data-level="top" data-value="중형" style="padding-left:22px;">중형</div>
      </div>

      <div class="treeGroup">
        <div class="treeNode" data-level="top" data-value="대형">
          <button class="expandBtn" data-group="대형" aria-label="대형 하위 분류 펼치기">▸</button>
          <span>대형</span>
        </div>
        <div class="treeChildren" data-group-children="대형" hidden>
          <div class="treeNode" data-level="sub" data-value="대형">대형</div>
          <div class="treeNode" data-level="sub" data-value="초대형">초대형</div>
        </div>
      </div>
    </div>

    <div>
      <input type="text" id="searchInput" placeholder="품종 이름으로 검색... (예: 말티즈)">

      <span class="filterLabel">털</span>
      <div class="filterGroup" id="coatFilter">
        <button class="chip active" data-filter="coat" data-value="전체">전체</button>
        <button class="chip" data-filter="coat" data-value="짧은 털">짧은 털</button>
        <button class="chip" data-filter="coat" data-value="긴 털">긴 털</button>
        <button class="chip" data-filter="coat" data-value="곱슬 털">곱슬 털</button>
      </div>

      <span class="filterLabel">성격</span>
      <div class="filterGroup" id="personalityFilter">
        <button class="chip" data-personality="애교 많음">애교 많음</button>
        <button class="chip" data-personality="활발함">활발함</button>
        <button class="chip" data-personality="영리함">영리함</button>
        <button class="chip" data-personality="사교적">사교적</button>
        <button class="chip" data-personality="온순함">온순함</button>
        <button class="chip" data-personality="다정함">다정함</button>
        <button class="chip" data-personality="명랑함">명랑함</button>
        <button class="chip" data-personality="용감함">용감함</button>
        <button class="chip" data-personality="독립적">독립적</button>
        <button class="chip" data-personality="충성심 강함">충성심 강함</button>
        <button class="chip" data-personality="경계심 강함">경계심 강함</button>
        <button class="chip" data-personality="고집 있음">고집 있음</button>
      </div>
    </div>
  </div>

  <p class="resultCount" id="resultCount"></p>
  <main class="grid" id="breedGrid"></main>
  <p class="emptyState" id="emptyState" hidden>일치하는 품종이 없어요. 다른 검색어나 필터를 시도해보세요.</p>
</div>

<div class="modalOverlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

    { name:'세인트 버나드', nameEn:'Saint Bernard', topSize:'대형', subSize:'초대형', coat:'긴 털', origin:'스위스',
      weight:'54~82kg', height:'65~90cm', lifespan:'8~10년',
      grooming:3, energy:2, shedding:4,
      temperament:['온순함','다정함','느긋함'],
      health:'고관절 이형성증, 심장 질환, 더위에 취약해요.',
      environment:'넓은 공간이 필요하고 더운 환경은 피해야 해요.',
      pros:['온순하고 아이들에게 다정해요','차분한 성격으로 실내에서도 안정적이에요'],
      cons:['체구가 커 사료·관리 비용이 많이 들어요','더위에 매우 약해요'] },
    { name:'그레이트 데인', nameEn:'Great Dane', topSize:'대형', subSize:'초대형', coat:'짧은 털', origin:'독일',
      weight:'45~90kg', height:'71~86cm', lifespan:'8~10년',
      grooming:2, energy:3, shedding:3,
      temperament:['온순함','다정함','충성심 강함'],
      health:'위 확장·염전, 심장 질환에 주의가 필요해요.',
      environment:'큰 체구에 맞는 넓은 실내 공간이 필요해요.',
      pros:['온순한 성격의 "온화한 거인"이에요','아이들과도 잘 지내는 편이에요'],
      cons:['수명이 비교적 짧은 편이에요','대형견으로 유지 비용이 많이 들어요'] }
  ];

  let state = { search:'', sizeLevel:'all', sizeValue:'', coat:'전체', personality:new Set() };

  function makeIcon(topSize){
    const c = SIZE_COLORS[topSize];
    return `<div class="iconWrap" style="background:${c.bg}; color:${c.fg};">${PAW_ICON}</div>`;
  }

  function matchSize(b){
    if(state.sizeLevel === 'all') return true;
    if(state.sizeLevel === 'top') return b.topSize === state.sizeValue;
    if(state.sizeLevel === 'sub') return b.subSize === state.sizeValue;
    return true;
  }

  function matchPersonality(b){
    if(state.personality.size === 0) return true;
    return b.temperament.some(t => state.personality.has(t));
  }

  function renderGrid(){
    const grid = document.getElementById('breedGrid');
    const empty = document.getElementById('emptyState');
    const resultCount = document.getElementById('resultCount');

    const filtered = BREEDS.filter(b => {
      const matchSearch = b.name.includes(state.search) || b.nameEn.toLowerCase().includes(state.search.toLowerCase());
      const matchCoat = state.coat === '전체' || b.coat === state.coat;
      return matchSearch && matchCoat && matchSize(b) && matchPersonality(b);
    });

    empty.hidden = filtered.length !== 0;
    resultCount.textContent = `${filtered.length}개 품종`;

    grid.innerHTML = filtered.map(b => {
      const c = SIZE_COLORS[b.topSize];
      return `
        <article class="card" data-name="${b.name}">
          <div class="cardTop">
            <span class="plateNo mono">No. ${String(BREEDS.indexOf(b)+1).padStart(2,'0')}</span>
            <span class="sizeTag" style="background:${c.bg}; color:${c.fg};">${b.subSize}</span>
          </div>
          ${makeIcon(b.topSize)}
          <div class="cardName">
            <h3>${b.name}</h3>
            <span>${b.nameEn}</span>
          </div>
          <div class="cardTrait">${b.temperament[0]} · ${b.coat}</div>
        </article>
      `;
    }).join('');

    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openModal(card.dataset.name));
    });
  }

  function dots(value){
    return Array.from({length:5}, (_, i) =>
      `<span class="dot ${i < value ? 'filled' : ''}"></span>`
    ).join('');
  }

  function openModal(name){
    const b = BREEDS.find(x => x.name === name);
    const modal = document.getElementById('modalContent');

    modal.innerHTML = `
      <button class="modalClose" id="modalCloseBtn" aria-label="닫기">✕</button>
      <div class="modalHead">
        ${makeIcon(b.topSize)}
        <div>
          <h2>${b.name}</h2>
          <div class="originLine">${b.nameEn} · 원산지 ${b.origin}</div>
        </div>
      </div>

      <div class="statRow">
        <div class="statBlock">
          <div class="label">크기 분류</div>
          <div class="value">${b.topSize} (${b.subSize})</div>
        </div>
        <div class="statBlock">
          <div class="label">평균 수명</div>
          <div class="value">${b.lifespan}</div>
        </div>
        <div class="statBlock">
          <div class="label">몸무게</div>
          <div class="value">${b.weight}</div>
        </div>
        <div class="statBlock">
          <div class="label">어깨 높이</div>
          <div class="value">${b.height}</div>
        </div>
      </div>

      <div class="gaugeSection">
        <div class="gaugeRow">
          <span class="label">털 관리</span>
          <div class="dots">${dots(b.grooming)}</div>
        </div>
        <div class="gaugeRow">
          <span class="label">활동량</span>
          <div class="dots">${dots(b.energy)}</div>
        </div>
        <div class="gaugeRow">
          <span class="label">털 빠짐</span>
          <div class="dots">${dots(b.shedding)}</div>
        </div>
      </div>

      <div class="tagsSection">
        <div class="sectionLabel">성격 특성</div>
        <div class="temperamentTags">
          ${b.temperament.map(t => `<span>${t}</span>`).join('')}
        </div>
      </div>

      <div class="prosConsRow">
        <div class="prosBlock">
          <div class="sectionLabel">장점</div>
          <ul>${b.pros.map(p => `<li>${p}</li>`).join('')}</ul>
        </div>
        <div class="consBlock">
          <div class="sectionLabel">단점</div>
          <ul>${b.cons.map(c => `<li>${c}</li>`).join('')}</ul>
        </div>
      </div>

      <div class="noteBlock">
        <div class="sectionLabel">건강 주의사항</div>
        <p>${b.health}</p>
      </div>

      <div class="noteBlock">
        <div class="sectionLabel">적합한 생활환경</div>
        <p>${b.environment}</p>
      </div>

      <div class="noteBlock">
        <div class="sectionLabel">훈련 영상</div>
        <a class="videoLink" href="https://www.youtube.com/results?search_query=${encodeURIComponent(b.name + ' 강아지 훈련 방법')}" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          ${b.name} 훈련 영상 보러가기
        </a>
      </div>
    `;

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal(){
    document.getElementById('modalOverlay').classList.remove('open');
  }

  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') closeModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    state.search = e.target.value.trim();
    renderGrid();
  });

  // 크기 분류 트리
  document.querySelectorAll('.expandBtn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const group = btn.dataset.group;
      const childrenEl = document.querySelector(`[data-group-children="${group}"]`);
      const isOpen = !childrenEl.hidden;
      childrenEl.hidden = isOpen;
      btn.classList.toggle('open', !isOpen);
    });
  });

  document.querySelectorAll('.treeNode').forEach(node => {
    node.addEventListener('click', () => {
      state.sizeLevel = node.dataset.level;
      state.sizeValue = node.dataset.value;
      document.querySelectorAll('.treeNode').forEach(n => n.classList.remove('active'));
      node.classList.add('active');
      renderGrid();
    });
  });

  // 털 필터 (단일 선택)
  document.querySelectorAll('#coatFilter .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      state.coat = chip.dataset.value;
      document.querySelectorAll('#coatFilter .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      renderGrid();
    });
  });

  // 성격 필터 (다중 선택)
  document.querySelectorAll('#personalityFilter .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const value = chip.dataset.personality;
      if (state.personality.has(value)) {
        state.personality.delete(value);
        chip.classList.remove('active');
      } else {
        state.personality.add(value);
        chip.classList.add('active');
      }
      renderGrid();
    });
  });

  renderGrid();
</script>

</body>
</html>
